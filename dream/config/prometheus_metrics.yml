global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: dream
    static_configs:
      - targets: ["127.0.0.1:9464"]
        labels:
          service: dream
          host: local

rule_files:
  - alerts.yml

