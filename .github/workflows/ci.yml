name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Fast gate on every push and PR. Installs only the light deps the test suite
  # actually needs. The smoke test lists the MCP tools via the public API and
  # does not load the ML stack, so lancedb and sentence-transformers are not
  # required here.
  test-light:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install light dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mcp>=1.2.0,<2.0" "cryptography>=42.0,<44.0" "prometheus-client>=0.20,<1.0" "httpx>=0.27,<1.0" "numpy>=1.26,<3.0" "pytest>=8.0,<9.0"

      - name: Run test suite
        run: pytest -q tests/

  # Full install with the ML stack. Heavier and slower, so it runs only on
  # pushes to the main branches, not on every PR commit.
  test-full:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q tests/
